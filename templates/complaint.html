<!DOCTYPE html>
<html>
<head>
    <title>Register Complaint</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">
            🏛 Smart Civic Complaint System
        </a>

        <div>
            <a href="/" class="btn btn-outline-light me-2">Home</a>
            <a href="/dashboard" class="btn btn-outline-light">Dashboard</a>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-6">

            <div class="card shadow-lg p-4">

                <h2 class="text-center mb-4">
                    📝 Register Complaint
                </h2>

                <form action="/submit" method="POST">

                    <div class="mb-3">
                        <label class="form-label">
                            Full Name
                        </label>
                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Email
                        </label>
                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Mobile Number
                        </label>
                        <input
                            type="text"
                            name="mobile"
                            class="form-control"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Department
                        </label>

                        <select
                            name="department"
                            class="form-select">

                            <option>Water Supply</option>
                            <option>Street Lights</option>
                            <option>Garbage</option>
                            <option>Road Maintenance</option>
                            <option>Public Health</option>

                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Ward Number
                        </label>

                        <input
                            type="text"
                            name="ward"
                            class="form-control"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Priority
                        </label>

                        <select
                            name="priority"
                            class="form-select">

                            <option>High</option>
                            <option>Medium</option>
                            <option>Low</option>

                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Complaint Details
                        </label>

                        <textarea
                            name="complaint"
                            class="form-control"
                            rows="4"
                            required></textarea>
                    </div>

                    <div class="text-center">

                        <button
                            type="submit"
                            class="btn btn-primary btn-lg">

                            Submit Complaint

                        </button>

                        <a
                            href="/"
                            class="btn btn-secondary btn-lg">

                            Cancel

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

<footer class="text-center mt-5 mb-3 text-muted">

    Smart Civic Complaint Management System

    <br>

    Built with Python • Flask • SQLite • SQL • Bootstrap

</footer>

</body>
</html>
