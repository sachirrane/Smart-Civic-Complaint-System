<!DOCTYPE html>
<html>
<head>

    <title>Admin Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            🏛 Smart Civic Complaint System
        </a>

        <div class="ms-auto">

            <a href="/" class="btn btn-outline-light me-2">
                Home
            </a>

            <a href="/about" class="btn btn-outline-light me-2">
                About
            </a>

            <a href="/contact" class="btn btn-outline-light me-2">
                Contact
            </a>

            <a href="/register" class="btn btn-outline-light me-2">
                Register
            </a>

            <a href="/user_login" class="btn btn-outline-light me-2">
                User Login
            </a>

            <a href="/admin_login" class="btn btn-warning">
                Admin Login
            </a>

        </div>

    </div>
</nav>

<div class="container">

<div class="row justify-content-center align-items-center vh-100">

<div class="col-md-5">

<div class="card shadow p-4">

<h2 class="text-center">
👨‍💼 Admin Login
</h2>

<hr>

<form action="/admin_check" method="POST">

<label>Email</label>

<input
type="email"
name="email"
class="form-control"
required>

<br>

<label>Password</label>

<input
type="password"
name="password"
class="form-control"
required>

<br>

<input
type="submit"
value="Login"
class="btn btn-danger w-100">

</form>

</div>

</div>

</div>

</div>

</body>
</html>
