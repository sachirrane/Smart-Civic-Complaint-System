<!DOCTYPE html>
<html>
<head>

<title>Edit Complaint</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-8">

<div class="card shadow p-4">

<h2 class="text-center">
✏️ Edit Complaint
</h2>

<form action="/update/{{ complaint['id'] }}" method="POST">

<label>Name</label>
<input
type="text"
name="name"
class="form-control"
value="{{ complaint['name'] }}">

<br>

<label>Department</label>
<input
type="text"
name="department"
class="form-control"
value="{{ complaint['department'] }}">

<br>

<label>Ward</label>
<input
type="text"
name="ward"
class="form-control"
value="{{ complaint['ward'] }}">

<br>

<label>Priority</label>

<select
name="priority"
class="form-select">

<option>High</option>
<option>Medium</option>
<option>Low</option>

</select>

<br>

<label>Complaint</label>

<textarea
name="complaint"
class="form-control"
rows="4">{{ complaint['complaint'] }}</textarea>

<br>

<button
class="btn btn-primary">
Update Complaint
</button>

<a href="/dashboard"
class="btn btn-secondary">
Cancel
</a>

</form>

</div>

</div>

</div>

</div>

</body>
</html>
