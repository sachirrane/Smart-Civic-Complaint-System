<!DOCTYPE html>
<html>
<head>
    <title>User Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            🏛 Smart Civic Complaint System
        </a>

        <div class="ms-auto">

            <a href="/" class="btn btn-outline-light me-2">
                Home
            </a>

            <a href="/about" class="btn btn-outline-light me-2">
                About
            </a>

            <a href="/contact" class="btn btn-outline-light me-2">
                Contact
            </a>

            <a href="/register" class="btn btn-outline-light me-2">
                Register
            </a>

            <a href="/user_login" class="btn btn-outline-light me-2">
                User Login
            </a>

            <a href="/admin_login" class="btn btn-warning">
                Admin Login
            </a>

        </div>

    </div>
</nav>

<div class="container mt-5">

    <div class="card p-4 shadow">

        <h2 class="text-center">
            👤 Citizen Registration
        </h2>

        <br>

        <form action="/save_user" method="POST">

            <label>Full Name</label>
            <input
            type="text"
            name="name"
            class="form-control"
            required>

            <br>

            <label>Email</label>
            <input
            type="email"
            name="email"
            class="form-control"
            required>

            <br>

            <label>Password</label>
            <input
            type="password"
            name="password"
            class="form-control"
            required>

            <br>

            <button
            class="btn btn-primary w-100">
            Register
            </button>

        </form>

    </div>

</div>

</body>
</html>
